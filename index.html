<!doctype html><html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>回診前症狀紀錄</title>
<meta name="robots" content="noindex">
<meta name="description" content="免疫治療與抗體藥物複合體門診 回診前症狀紀錄（試用版，資料只留在本機）">
<style>
:root{
  --bg:#fffdfa; --card:#fffdfa; --sunk:#f3efe8; --ink:#2c2926; --ink2:#5b5751; --line:#e5ded3;--edge:#8e887f;
  --teal:#0f6f68; --teal-d:#0a544e; --teal-bg:#e8f2f0;
  --red:#913327; --red-bg:#fdf1ef; --amber:#6f4f0c; --amber-bg:#fdf7e9;
  --fs:19px; --fq:26px; --fb:21px; --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:var(--fs)/1.65 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
body{padding-bottom:env(safe-area-inset-bottom)}

/* ---- 頂部進度 ---- */
#top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--edge);box-shadow:0 2px 8px rgba(44,41,38,.05)}
#bar{height:8px;background:var(--sunk)}#fill{height:100%;width:0;background:var(--teal);transition:width .3s}
#toprow{display:flex;align-items:baseline;justify-content:space-between;padding:11px 16px;
  font-size:18px;color:var(--ink2)}
#toprow b{color:var(--ink);font-size:22px;font-variant-numeric:tabular-nums}

/* ---- 卡片 ---- */
.wrap{max-width:620px;margin:0 auto;padding:20px 20px 150px}
.card{background:transparent;border:none;padding:4px 0 8px;margin-bottom:0}
/* 卡片只在「同型物件有好幾個」時才有意義。病人端一頁一件事,
   畫面本身就是那張卡,再畫一圈框只是增加視覺噪音並吃掉可用寬度。 */
h1{font-size:28px;margin:0 0 6px}
.sub{color:var(--ink2);font-size:17px;margin:0 0 18px}
.qhead{display:flex;gap:12px;align-items:flex-start;margin-bottom:4px}
.qicon{font-size:36px;line-height:1.1}
.qlabel{font-size:22px;font-weight:700;color:var(--teal-d)}
.q{margin:26px 0 0;padding-top:22px;border-top:1px solid var(--sunk)}
.q:first-of-type{border-top:none;padding-top:8px}
.qt{font-size:var(--fq);font-weight:600;line-height:1.45;margin-bottom:6px}
.hint{color:var(--ink2);font-size:16px;margin:-2px 0 12px;line-height:1.55}

/* ---- 選項 ---- */
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:14px 18px;
  background:var(--card);border:2px solid var(--edge);border-radius:12px;
  font:inherit;font-size:var(--fb);color:var(--ink);text-align:left;cursor:pointer}
.opt:active{transform:scale(.99)}
.opt .dot{flex:0 0 26px;height:26px;border:2px solid var(--edge);border-radius:50%;background:var(--card)}
.opt.on{border-color:var(--teal);background:var(--teal-bg)}
.opt.on .dot{border-color:var(--teal);background:var(--teal);box-shadow:inset 0 0 0 4px var(--teal-bg)}
.opt.warn.on{border-color:var(--red);background:var(--red-bg)}
.opt.warn.on .dot{border-color:var(--red);background:var(--red);box-shadow:inset 0 0 0 4px var(--red-bg)}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ---- 數字 ---- */
.num{display:flex;align-items:center;gap:12px}
.num input{flex:1;min-width:0;font:inherit;font-size:28px;text-align:center;padding:14px;
  border:2px solid var(--edge);border-radius:12px;background:var(--card);color:var(--ink)}
.num input:focus{outline:none;border-color:var(--teal)}
.step{width:62px;height:62px;font-size:30px;border:2px solid var(--edge);background:var(--card);
  border-radius:12px;color:var(--teal-d);cursor:pointer}
.unit{color:var(--ink2);font-size:19px;min-width:28px}
.skip{background:none;border:none;color:var(--ink2);font:inherit;font-size:16px;
  text-decoration:underline;padding:10px 0;cursor:pointer}

/* ---- 自由文字 / 錄音 ---- */
textarea{width:100%;min-height:150px;font:inherit;font-size:21px;line-height:1.6;padding:14px;
  border:2px solid var(--edge);border-radius:12px;background:var(--card);color:var(--ink);resize:vertical}
textarea:focus{outline:none;border-color:var(--teal)}
.rec{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.recbtn{display:flex;align-items:center;gap:10px;min-height:58px;padding:0 22px;border-radius:12px;
  border:2px solid var(--teal);background:var(--teal-bg);color:var(--teal-d);font:inherit;font-size:var(--fb);cursor:pointer}
.recbtn.rec-on{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.blob{width:14px;height:14px;border-radius:50%;background:currentColor}
.rec-on .blob{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}

/* ---- 人體圖 ---- */
.bodywrap{display:flex;gap:10px;justify-content:center;margin-top:8px}
.bodywrap svg{width:100%;max-width:170px;height:auto}
.rg{fill:#efe9df;stroke:#cfc6b8;stroke-width:1.5;cursor:pointer}
.rg.on{fill:#e08a7d;stroke:var(--red)}
.bsa{text-align:center;margin-top:10px;font-size:18px;color:var(--ink2)}
.bsa b{color:var(--ink);font-size:22px}

/* ---- 底部 ---- */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);
  border-top:1px solid var(--edge);box-shadow:0 -3px 12px rgba(44,41,38,.07);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
#navin{max-width:640px;margin:0 auto;display:flex;gap:12px}
.btn{flex:1;min-height:64px;border-radius:12px;border:2px solid var(--teal);background:var(--teal);
  color:#fffdfa;font:inherit;font-size:23px;font-weight:700;cursor:pointer}
.btn.ghost{flex:0 0 116px;background:var(--card);color:var(--teal-d)}
.btn:disabled{opacity:.4}

/* ---- 其他 ---- */
.chips{display:flex;flex-wrap:wrap;gap:9px;margin:10px 0 0}
.chip{display:inline-flex;align-items:center;min-height:46px;padding:0 18px;
  border:2px solid var(--edge);border-radius:999px;background:var(--card);
  font:inherit;font-size:17px;color:var(--ink2)}
.chip.sel{border-color:var(--teal);background:var(--teal-bg);color:var(--teal-d);cursor:pointer}
.chip.sel.on{background:var(--teal);color:#fffdfa}
.note{background:var(--teal-bg);border-left:5px solid var(--teal);border-radius:8px;
  padding:13px 16px;font-size:17px;color:var(--teal-d);margin-top:16px;line-height:1.6}
.warnbox{background:var(--amber-bg);border-left:5px solid var(--amber);border-radius:8px;
  padding:13px 16px;font-size:17px;color:#6d4c0c;margin-top:16px;line-height:1.6}
.rvrow{display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.rvrow:last-child{border:none}.rvq{color:var(--ink2);font-size:17px}.rva{font-weight:700;text-align:right}
.rvchg{font-size:16px;color:var(--amber);font-weight:700}
.hid{display:none!important}
.pill{display:inline-block;padding:3px 12px;border-radius:999px;font-size:15px;font-weight:700}
.pill.t{background:var(--teal-bg);color:var(--teal-d)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;z-index:60;
  background:#2c2926;color:#fffdfa;padding:13px 22px;border-radius:999px;font-size:17px;opacity:0;
  transition:opacity .25s;pointer-events:none}
#toast.on{opacity:.95}
label.f{display:block;font-size:18px;color:var(--ink2);margin:16px 0 6px}
input.f{width:100%;font:inherit;font-size:23px;padding:14px;border:2px solid var(--edge);
  border-radius:12px;background:var(--card);color:var(--ink)}
input.f:focus{outline:none;border-color:var(--teal)}

/* 焦點可見:原本 :focus{outline:none} 把鍵盤使用者的焦點指示拿掉了,
   那是 WCAG 2.4.7 的違反。改用 :focus-visible 保留滑鼠時的乾淨外觀。 */
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:4px}
button:focus-visible,.opt:focus-visible,.chip:focus-visible{outline-offset:3px}
</style>
<style>
/* ⚠️ 病人端的 :root 沒有 --violet/--violet-bg（那是專業端的色票）。
   CSS 變數未定義時是**靜默失效**:不報錯,邊框就是不見了。
   所以這裡自帶,數值與專業端相同以維持整站一致。
   已納入 test_contrast.py,避免再度靜默壞掉。 */
:root{--violet:#544681;--violet-bg:#efecf7}
/* ===== 給醫師看 =====
   這一頁的閱讀情境跟其他頁不同:醫師是隔著桌子看「別人的手機」,
   距離更遠、角度更斜,而且是在掃不是在讀。所以字級大幅拉高、
   內容砍到只剩兩塊,其餘收起來。 */
#docview{position:fixed;inset:0;z-index:80;background:var(--card);overflow-y:auto;
  padding:18px 18px calc(96px + env(safe-area-inset-bottom))}
#docview .who{font-size:19px;color:var(--ink2);margin-bottom:14px;
  padding-bottom:12px;border-bottom:2px solid var(--edge)}
#docview .who b{font-size:24px;color:var(--ink);font-variant-numeric:tabular-nums}
#docview h2{font-size:22px;margin:0 0 10px;color:var(--red)}
#docview h2.q{color:var(--violet)}
#docview ul{margin:0 0 22px;padding-left:28px}
#docview li{font-size:28px;line-height:1.5;margin:0 0 10px;font-weight:600}
#docview .said{font-size:28px;line-height:1.6;font-weight:600;padding:14px 16px;
  background:var(--violet-bg);border-left:6px solid var(--violet);border-radius:8px;margin-bottom:22px}
#docview .none{font-size:26px;font-weight:600;color:var(--teal-d);
  background:var(--teal-bg);border-left:6px solid var(--teal);border-radius:8px;
  padding:14px 16px;margin-bottom:22px}
#docview .sym{font-size:21px;line-height:1.7;margin-bottom:20px}
#docview .sym b{font-size:22px}
#docview .un{font-size:18px;color:var(--ink2);margin-bottom:10px}
#docback{position:fixed;left:18px;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));
  z-index:81;min-height:60px;border-radius:12px;border:2px solid var(--edge);
  background:var(--card);color:var(--ink2);font:inherit;font-size:19px;cursor:pointer}
#docbtn{width:100%;min-height:64px;margin-bottom:16px;border-radius:12px;
  border:2px solid var(--teal);background:var(--teal);color:#fffdfa;
  font:inherit;font-size:23px;font-weight:700;cursor:pointer}
</style>
</head><body><script>

, {"id": "now", "type": "number", "text": "最近最多的一天幾次？", "unit": "次", "min": 0, "max": 40}, {"id": "consistency", "type": "yesno", "text": "大便有沒有變稀、變水？"}, {"id": "blood", "type": "yesno", "text": "有沒有血或黏液？"}, {"id": "abd_pain", "type": "yesno", "text": "肚子會不會痛？"}], "also": ["Colitis"], "note": "血便或黏液便加上腹痛會另外觸發 Colitis 詞條的考量(v6.0 Colitis 第二級即為腹痛,或糞中帶血或黏液)。"}, {"id": "breath", "label": "咳嗽、喘", "icon": "🫁", "organ": "肺", "term": "Dyspnea", "class": "both", "q": [{"id": "exertion", "type": "choice", "text": "什麼時候會喘？", "opts": ["不會喘", "比較用力活動時（爬樓梯、快走）", "稍微動一下就喘（走平路、穿衣服）", "坐著不動也喘"], "hint": "這四個選項直接對應 CTCAE 的分級錨點。"}, {"id": "cough", "type": "choice", "text": "咳嗽的程度？", "opts": ["不咳", "偶爾咳", "常常咳、會影響生活", "咳到很難過"]}, {"id": "new_worse", "type": "yesno", "text": "這個咳或喘是這次治療之後才有的,或明顯變嚴重了嗎？"}], "also": ["Cough", "Pneumonitis"], "red_priority": "high", "note": "⚠️ 肺炎/間質性肺病是 IO 與 ADC 共同的致命毒性,而 Pneumonitis 第一級在定義上是無症狀、只有影像發現,問卷看不到。所以這一組題目的工作不是分級,是觸發影像檢查。T-DXd 的仿單對任何等級的間質性肺病都要求停藥,門檻要設得比其他症狀低。"}, {"id": "rash", "label": "皮膚起疹子", "icon": "🩹", "organ": "皮膚", "term": "Rash maculo-papular", "class": "both", "q": [{"id": "present", "type": "yesno", "text": "皮膚有沒有起疹子？"}, {"id": "symptom", "type": "choice", "text": "疹子會不會不舒服？", "opts": ["不會,只是看得到", "有一點", "中等", "很不舒服"], "when": "present"}, {"id": "extent", "type": "bodymap", "text": "疹子長在哪裡？請在圖上點選", "when": "present", "hint": "點選的範圍會換算成大約的體表面積。CTCAE v6.0 只在第三級用到體表面積,門檻是超過一半。"}, {"id": "blister", "type": "yesno", "text": "有沒有起水泡、脫皮,或嘴巴、眼睛的黏膜破掉？", "when": "present", "hint": "這一題是安全題,勾了會直接亮紅旗。"}, {"id": "photo", "type": "photo", "text": "方便的話拍一張照片", "when": "present", "hint": "照片只存本機。一張照片同時給醫師範圍、型態、分布,那是文字問不出來的。"}], "red_priority": "high", "note": "⚠️ 水泡、脫皮、黏膜侵犯是 Stevens-Johnson 症候群與毒性表皮溶解的警訊,enfortumab vedotin 有相關的黑框警示。這一題不參與分級,直接紅旗。"}, {"id": "itch", "label": "皮膚癢", "icon": "🪶", "organ": "皮膚", "term": "Pruritus", "class": "both", "q": [{"id": "present", "type": "yesno", "text": "皮膚會不會癢？"}, {"id": "spread", "type": "choice", "text": "癢的範圍？",     return out;
  }
  return {evaluate:evaluate, fire:fire};
})();
</script>

<script>
/* =====================================================================
   病人端。設計原則:
   1. 開放主訴問在結構題之前 —— 先跑清單會定錨,病人後面只會補充清單提過的。
   2. 一次一題組,大字單欄,不用下拉選單。
   3. 每動一下就存 localStorage,叫號打斷也不會掉。
   4. 送不出去就排進待送佇列,回線自動補送。
   ===================================================================== */
var PANEL=null, STEPS=[], I=0, A={}, SESS=null, MEDIA={}, VISIT=null;
var WATCH='visit_only', SAFETY={phone:'',text:''};
var $=function(s){return document.querySelector(s)};
var LS={get:function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
        set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
        del:function(k){try{localStorage.removeItem(k)}catch(e){}}};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function post(b){
  /* 靜態版:不發任何網路請求,資料不離開這支手機 */
  return Promise.resolve(
    b.action==='spec' ? {status:'ok',panel:window.__PANEL__,
                         watch_mode:'visit_only',escalation:window.__SAFETY__}
    : {status:'ok', local:true});
}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('on')},2200)}

/* ---------- 登入 ---------- */
function radios(host,opts,cb,sel){
  host.innerHTML='';
  opts.forEach(function(o,i){
    var b=document.createElement('button');
    b.className='opt'+(sel===o.v?' on':'');
    b.innerHTML='<span class="dot"></span><span>'+esc(o.t)+'</span>';
    b.onclick=function(){Array.prototype.forEach.call(host.children,function(c){c.classList.remove('on')});
      b.classList.add('on');cb(o.v)};
    host.appendChild(b);
  });
}
var LOGIN={filled_by:'self',drug_class:'io'};
radios($('#byWho'),[{v:'self',t:'病人自己填'},{v:'family',t:'家屬代填'}],
  function(v){LOGIN.filled_by=v},'self');
radios($('#dclass'),[{v:'io',t:'免疫治療（IO）'},{v:'adc',t:'抗體藥物複合體（ADC）'},
  {v:'both',t:'兩種都有'}],function(v){LOGIN.drug_class=v},'io');

/* ---------- 建立題目流程 ---------- */
function buildSteps(){
  STEPS=[{kind:'cc'}];
  PANEL.items.forEach(function(it){
    if(it['class']==='both'||it['class']===LOGIN.drug_class||LOGIN.drug_class==='both')
      STEPS.push({kind:'item',item:it});
  });
  STEPS.push({kind:'adl'});
}

/* ---------- 取值/存值 ---------- */
function val(item,q){return (A[item]||{})[q]}
function setv(item,q,v){ (A[item]=A[item]||{})[q]=v; save(); }
function save(){ LS.set('epro2.draft',{mrn:SESS.mrn,A:A,i:I,login:LOGIN,visit:VISIT}); }

function visible(it,q){
  if(!q.when) return true;
  var m=q.when.match(/^(\w+)(>=|<=|==|>|<)?(-?[\d.]+)?$/);
  if(!m) return true;
  var v=val(it.id,m[1]);
  if(v===undefined||v===null||v==='') return false;
  if(!m[2]) return !!v;
  var n=parseFloat(m[3]);
  return m[2]==='>='?v>=n:m[2]==='<='?v<=n:m[2]==='=='?v==n:m[2]==='>'?v>n:v<n;
}

/* ---------- 渲染 ---------- */
function render(){
  var s=STEPS[I], st=$('#stage');
  $('#fill').style.width=((I)/(STEPS.length)*100).toFixed(1)+'%';
  $('#tleft').innerHTML='第 <b>'+(I+1)+'</b> 題，共 '+STEPS.length+' 題';
  $('#tright').textContent=SESS.name||'';
  $('#back').disabled=(I===0);
  $('#next').textContent=(I===STEPS.length-1)?'看一下再產生摘要':'下一步';
  st.innerHTML='';
  if(s.kind==='cc') return renderCC(st);
  if(s.kind==='adl') return renderADL(st);
  renderItem(st,s.item);
  window.scrollTo(0,0);
}

function renderCC(st){
  var c=PANEL.chief_complaint;
  st.innerHTML='<div class="qhead"><div class="qicon">💬</div><div>'+
    '<div class="qlabel">'+esc(c.title)+'</div></div></div>'+
    '<div class="q"><div class="qt">'+esc(c.prompt)+'</div>'+
    '<div class="hint">'+esc(c.hint)+'</div>'+
    '<textarea id="cctext" placeholder="例如：這兩天晚上咳到睡不著，我先生說我講話怪怪的"></textarea>'+
    '<div class="rec"><button class="recbtn" id="recbtn"><span class="blob"></span>'+
      '<span id="reclab">改用錄音</span></button><span id="recinfo" class="hint" style="margin:0"></span></div>'+
    '<div class="note">'+esc(c.audio_note)+'</div></div>';
  var ta=$('#cctext'); ta.value=(A.cc||{}).text||'';
  ta.oninput=function(){setv('cc','text',ta.value)};
  if(MEDIA.audio) $('#recinfo').textContent='已錄好一段('+MEDIA.audioSec+' 秒)';
  $('#recbtn').onclick=toggleRec;
}

/* 錄音:只存本機,不轉文字。瀏覽器的語音辨識 API 會把音訊送到外部伺服器,
   那違反本系統「資料不出這台機器」的前提,所以刻意不用。 */
var REC=null,CHUNKS=[],T0=0;
function toggleRec(){
  var b=$('#recbtn'),l=$('#reclab');
  if(REC&&REC.state==='recording'){REC.stop();return}
  if(!navigator.mediaDevices||!window.MediaRecorder){toast('這個瀏覽器不支援錄音');return}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    REC=new MediaRecorder(stream);CHUNKS=[];T0=Date.now();
    REC.ondataavailable=function(e){if(e.data.size)CHUNKS.push(e.data)};
    REC.onstop=function(){
      stream.getTracks().forEach(function(t){t.stop()});
      var blob=new Blob(CHUNKS,{type:REC.mimeType||'audio/webm'});
      var fr=new FileReader();
      fr.onload=function(){MEDIA.audio=fr.result;MEDIA.audioSec=Math.round((Date.now()-T0)/1000);
        $('#recinfo').textContent='已錄好一段('+MEDIA.audioSec+' 秒)';};
      fr.readAsDataURL(blob);
      b.classList.remove('rec-on');l.textContent='重新錄一次';
    };
    REC.start();b.classList.add('rec-on');l.textContent='錄音中，按一下停止';
  }).catch(function(){toast('沒辦法開啟麥克風')});
}

function renderItem(st,it){
  var h='<div class="qhead"><div class="qicon">'+it.icon+'</div><div>'+
    '<div class="qlabel">'+esc(it.label)+'</div>'+
    '<div class="hint" style="margin:0">'+esc(it.organ)+'</div></div></div>';
  it.q.forEach(function(q){ h+='<div class="q" data-q="'+q.id+'"></div>' });
  st.innerHTML=h;
  it.q.forEach(function(q){ paint(it,q) });
}

function paint(it,q){
  var host=document.querySelector('[data-q="'+q.id+'"]');
  if(!host) return;
  if(!visible(it,q)){host.innerHTML='';host.classList.add('hid');return}
  host.classList.remove('hid');
  var h='<div class="qt">'+esc(q.text)+'</div>';
  if(q.hint) h+='<div class="hint">'+esc(q.hint)+'</div>';
  var v=val(it.id,q.id);
  if(q.type==='yesno'){
    var warn=(q.id==='blister')?' warn':'';
    h+='<div class="opts yn">'+
      '<button class="opt'+(v===0?' on':'')+'" data-v="0"><span class="dot"></span>沒有</button>'+
      '<button class="opt'+warn+(v===1?' on':'')+'" data-v="1"><span class="dot"></span>有</button></div>';
  }else if(q.type==='choice'){
    h+='<div class="opts">'+q.opts.map(function(o,i){
      return '<button class="opt'+(v===i?' on':'')+'" data-v="'+i+'"><span class="dot"></span>'+esc(o)+'</button>'
    }).join('')+'</div>';
  }else if(q.type==='number'){
    h+='<div class="num"><button class="step" data-d="-1">−</button>'+
       '<input type="number" inputmode="decimal" value="'+(v==null?'':v)+'" '+
       'step="'+(q.step||1)+'" min="'+q.min+'" max="'+q.max+'">'+
       '<span class="unit">'+esc(q.unit||'')+'</span>'+
       '<button class="step" data-d="1">＋</button></div>'+
       '<button class="skip" data-skip="1">這題我不知道，先跳過</button>';
  }else if(q.type==='bodymap'){
    h+=bodymapHTML(val(it.id,'regions')||[]);
  }else if(q.type==='photo'){
    h+='<div class="opts"><label class="opt" style="justify-content:center">'+
       '<input type="file" accept="image/*" capture="environment" style="display:none" id="ph">'+
       '<span>📷　拍照或選一張照片</span></label></div>'+
       '<div class="hint" id="phinfo">'+(MEDIA.photo?'已選好一張照片':'')+'</div>';
  }
  host.innerHTML=h;
  wire(it,q,host);
}

function wire(it,q,host){
  host.querySelectorAll('.opt[data-v]').forEach(function(b){
    b.onclick=function(){
      setv(it.id,q.id,parseInt(b.dataset.v,10));
      it.q.forEach(function(qq){paint(it,qq)});
      if(q.id==='blister'&&parseInt(b.dataset.v,10)===1)
        toast('這一項醫療團隊會優先看');
    };
  });
  var inp=host.querySelector('input[type=number]');
  if(inp){
    inp.oninput=function(){
      var x=inp.value===''?null:parseFloat(inp.value);
      setv(it.id,q.id,x); it.q.forEach(function(qq){if(qq.id!==q.id)paint(it,qq)});
    };
    host.querySelectorAll('.step').forEach(function(b){
      b.onclick=function(){
        var stp=parseFloat(q.step||1), cur=parseFloat(inp.value);
        if(isNaN(cur)) cur=0;
        var nv=Math.min(q.max,Math.max(q.min,+(cur+stp*parseInt(b.dataset.d,10)).toFixed(1)));
        inp.value=nv; inp.oninput();
      };
    });
    var sk=host.querySelector('[data-skip]');
    if(sk) sk.onclick=function(){setv(it.id,q.id,null);inp.value='';
      toast('沒關係，醫師會知道這題沒填');it.q.forEach(function(qq){paint(it,qq)})};
  }
  host.querySelectorAll('.rg').forEach(function(p){
    p.onclick=function(){
      var sel=val(it.id,'regions')||[], k=p.dataset.k, i=sel.indexOf(k);
      if(i<0) sel.push(k); else sel.splice(i,1);
      setv(it.id,'regions',sel);
      var bsa=sel.reduce(function(a,k){return a+BSA[k]},0);
      setv(it.id,'bsa',bsa);
      paint(it,q);
    };
  });
  var ph=host.querySelector('#ph');
  if(ph) ph.onchange=function(){
    var f=ph.files[0]; if(!f) return;
    if(f.size>8*1024*1024){toast('照片太大了，請選小一點的');return}
    var fr=new FileReader();
    fr.onload=function(){MEDIA.photo=fr.result;$('#phinfo').textContent='已選好一張照片';};
    fr.readAsDataURL(f);
  };
}

/* 人體圖:九分法。點選的區域直接加總成體表面積百分比,
   這解掉了文字問卷問不出 BSA 的問題。v6.0 只有第三級用到 BSA,門檻 50%。 */
var BSA={head:9,chestF:18,backB:18,armL:9,armR:9,legL:18,legR:18,groin:1};
function bodymapHTML(sel){
  function on(k){return sel.indexOf(k)>=0?' on':''}
  var front='<svg viewBox="0 0 120 260" aria-label="正面">'+
    '<circle class="rg'+on('head')+'" data-k="head" cx="60" cy="24" r="20"/>'+
    '<rect class="rg'+on('chestF')+'" data-k="chestF" x="36" y="50" width="48" height="86" rx="10"/>'+
    '<rect class="rg'+on('armR')+'" data-k="armR" x="10" y="52" width="22" height="94" rx="11"/>'+
    '<rect class="rg'+on('armL')+'" data-k="armL" x="88" y="52" width="22" height="94" rx="11"/>'+
    '<rect class="rg'+on('groin')+'" data-k="groin" x="48" y="140" width="24" height="16" rx="7"/>'+
    '<rect class="rg'+on('legR')+'" data-k="legR" x="36" y="160" width="22" height="94" rx="11"/>'+
    '<rect class="rg'+on('legL')+'" data-k="legL" x="62" y="160" width="22" height="94" rx="11"/></svg>';
  var back='<svg viewBox="0 0 120 260" aria-label="背面">'+
    '<circle class="rg'+on('head')+'" data-k="head" cx="60" cy="24" r="20"/>'+
    '<rect class="rg'+on('backB')+'" data-k="backB" x="36" y="50" width="48" height="86" rx="10"/>'+
    '<rect class="rg'+on('armL')+'" data-k="armL" x="10" y="52" width="22" height="94" rx="11"/>'+
    '<rect class="rg'+on('armR')+'" data-k="armR" x="88" y="52" width="22" height="94" rx="11"/>'+
    '<rect class="rg'+on('legL')+'" data-k="legL" x="36" y="160" width="22" height="94" rx="11"/>'+
    '<rect class="rg'+on('legR')+'" data-k="legR" x="62" y="160" width="22" height="94" rx="11"/></svg>';
  var b=sel.reduce(function(a,k){return a+BSA[k]},0);
  return '<div class="bodywrap">'+front+back+'</div>'+
    '<div class="bsa">左邊是正面，右邊是背面　　已選 <b>'+b+'%</b> 體表面積</div>';
}

/* ADL:CTCAE v6.0 幾乎每個症狀的二三級分界就是這兩件事。
   直接問具體生活場景,比問抽象的干擾程度好答,而且落在醫師需要的形式上。
   ★ 必須問「是哪些不舒服造成的」,因為 CTCAE 的 ADL 條件綁在個別詞條上。 */
function renderADL(st){
  var ad=PANEL.adl;
  function block(key,def){
    var v=A[key], by=A[key+'_by']||[];
    var h='<div class="q"><div class="qt">'+esc(def.text)+'</div>'+
      '<div class="chips">'+def.examples.map(function(e){return '<span class="chip">'+esc(e)+'</span>'}).join('')+'</div>'+
      '<div class="opts yn" style="margin-top:12px" data-adl="'+key+'">'+
      '<button class="opt'+(v===0?' on':'')+'" data-v="0"><span class="dot"></span>都做得來</button>'+
      '<button class="opt'+(v===1?' on':'')+'" data-v="1"><span class="dot"></span>有做不來的</button></div>';
    if(v===1){
      h+='<div class="hint" style="margin-top:14px">'+esc(ad.attribution_prompt)+'</div><div class="chips" data-by="'+key+'">'+
        symptomsPresent().map(function(s){
          return '<button class="chip sel'+(by.indexOf(s.id)>=0?' on':'')+'" data-id="'+s.id+'">'+s.icon+' '+esc(s.label)+'</button>'
        }).join('')+'</div>';
    }
    return h+'</div>';
  }
  st.innerHTML='<div class="qhead"><div class="qicon">🏠</div><div><div class="qlabel">'+
    esc(ad.title)+'</div></div></div>'+block('adl_i',ad.instrumental)+block('adl_s',ad.self_care)+
    '<div class="note">'+esc(ad.why)+'</div>';
  st.querySelectorAll('[data-adl]').forEach(function(g){
    var key=g.dataset.adl;
    g.querySelectorAll('.opt').forEach(function(b){
      b.onclick=function(){A[key]=parseInt(b.dataset.v,10);
        if(A[key]===0)A[key+'_by']=[];save();renderADL(st)};
    });
  });
  st.querySelectorAll('[data-by]').forEach(function(g){
    var key=g.dataset.by;
    g.querySelectorAll('.chip.sel').forEach(function(b){
      b.onclick=function(){
        var by=A[key+'_by']||[], id=b.dataset.id, i=by.indexOf(id);
        if(i<0)by.push(id); else by.splice(i,1);
        A[key+'_by']=by;save();renderADL(st);
      };
    });
  });
}

/* 只列出病人確實回報「有」的症狀,避免歸因清單變成又一份全表 */
function symptomsPresent(){
  return PANEL.items.filter(function(it){
    if(!(it['class']==='both'||it['class']===LOGIN.drug_class||LOGIN.drug_class==='both')) return false;
    var s=A[it.id]||{};
    return Object.keys(s).some(function(k){
      var v=s[k]; return typeof v==='number'&&v>0;
    });
  });
}

/* ---------- 確認頁 ---------- */
function renderReview(){
  var h='', cc=(A.cc||{}).text||'';
  if(cc||MEDIA.audio){
    h+='<div class="rvrow"><span class="rvq">您自己說的</span><span class="rva">'+
       (cc?esc(cc.slice(0,60))+(cc.length>60?'…':''):'（錄音 '+MEDIA.audioSec+' 秒）')+'</span></div>';
  }
  PANEL.items.forEach(function(it){
    if(!(it['class']==='both'||it['class']===LOGIN.drug_class||LOGIN.drug_class==='both')) return;
    var s=A[it.id]||{}, parts=[];
    it.q.forEach(function(q){
      var v=s[q.id];
      if(v===undefined||v===null||v==='') return;
      if(q.type==='yesno') parts.push(q.text.replace(/[？?].*$/,'')+'：'+(v?'有':'沒有'));
      else if(q.type==='choice') parts.push(q.opts[v]);
      else if(q.type==='number') parts.push(v+(q.unit||''));
    });
    if(s.bsa) parts.push('範圍約 '+s.bsa+'%');
    if(parts.length) h+='<div class="rvrow"><span class="rvq">'+it.icon+' '+esc(it.label)+
      '</span><span class="rva">'+esc(parts.join('、'))+'</span></div>';
  });
  if(A.adl_i!=null||A.adl_s!=null){
    h+='<div class="rvrow"><span class="rvq">🏠 日常活動</span><span class="rva">'+
      (A.adl_i===1?'家事買菜有做不來的':'家事買菜都還行')+'<br>'+
      (A.adl_s===1?'洗澡穿衣有做不來的':'洗澡穿衣都還行')+'</span></div>';
  }
  var un=[];
  PANEL.items.forEach(function(it){
    if(!(it['class']==='both'||it['class']===LOGIN.drug_class||LOGIN.drug_class==='both')) return;
    var s=A[it.id]||{};
    if(!it.q.some(function(q){var v=s[q.id];return v!==undefined&&v!==null&&v!==''})) un.push(it.label);
  });
  if(un.length) h+='<div class="warnbox">沒填的有：'+esc(un.join('、'))+
    '<br>沒填不等於沒症狀，醫師那邊會看到是空白的。要補可以按上一步回去。</div>';
  $('#rvbody').innerHTML=h||'<p class="sub">目前還沒有填任何東西。</p>';
}

/* ---------- 送出 ---------- */
function doSubmit(){
  var payload={action:'submit',token:TOKEN||'',mrn:SESS.mrn,name:SESS.name,visit_id:VISIT,
    filled_by:LOGIN.filled_by,drug_class:LOGIN.drug_class,
    cc:{text:(A.cc||{}).text||'', audio_b64:MEDIA.audio||''},
    answers:JSON.parse(JSON.stringify(A))};
  if(MEDIA.photo){payload.answers.rash=payload.answers.rash||{};
    payload.answers.rash.photo_b64=MEDIA.photo;}
  delete payload.answers.cc;
  $('#form').classList.add('hid');$('#review').classList.add('hid');
  $('#nav').classList.add('hid');$('#top').classList.add('hid');
  $('#done').classList.remove('hid');
  buildSummary(); window.scrollTo(0,0);
}
function queue(p){var q=LS.get('epro2.queue',[]);q.push(p);LS.set('epro2.queue',q)}
function flush(){
  var q=LS.get('epro2.queue',[]); if(!q.length) return;
  post(q[0]).then(function(j){ if(j.status==='ok'){q.shift();LS.set('epro2.queue',q);
    if(q.length)flush(); else toast('剛才沒送出去的已經補送了')} }).catch(function(){});
}
/* 🔴 完成頁不顯示由系統判定的緊急度。
   本工具的定位是「到診前輔助」,不是監測系統 —— 沒有人力回應的警示只會製造
   雜訊溝通,而雜訊會讓真正重要的訊號一起被忽略。
   「您填的內容有幾項需要盡快處理」這種話會讓病人以為系統替他評估過緊急度,
   進而打電話來問,或反過來因為「系統說會處理」而延後就醫。兩種都是雜訊。
   改成一句**固定的、人人都看到的**安全網提醒:它不隨填答內容改變,
   所以不是警示,是每位治療中的病人本來就該有的衛教。 */
function showDone(offline,j){
  $('#form').classList.add('hid');$('#review').classList.add('hid');
  $('#nav').classList.add('hid');$('#top').classList.add('hid');
  $('#done').classList.remove('hid');
  if(offline){
    $('#donemsg').innerHTML='目前連不上，已經先存在這台裝置裡。<br>'+
      '連上之後會自動送出，您可以先去候診。';
    return;
  }
  var h=(WATCH==='monitored')
    ? '醫療團隊會在您進診間前看到。'
    : '<b>醫師看診時會看到這份紀錄。</b>';
  h+='<br>如果等一下想到還有別的，可以再填一次。';
  h+='<div class="note" style="text-align:left;margin-top:18px;font-size:18px">'+
     esc(SAFETY.text)+
     '<div style="font-size:22px;font-weight:700;margin-top:8px">'+esc(SAFETY.phone)+'</div></div>';
  $('#donemsg').innerHTML=h;
}


/* ===== 給醫師看 =====
   隔著桌子掃別人的手機,只留兩塊:要先談什麼、病人自己說了什麼。
   其餘收起來,要看再切回完整摘要。 */
function doctorView(fl){
  var cc=(A.cc||{}).text||'';
  var h='<div id="docview"><div class="who">病歷號 <b>'+esc(SESS.mrn)+'</b>　'+
    esc(SESS.name)+'　'+(LOGIN.filled_by==='family'?'家屬代填':'本人填')+'</div>';

  if(fl.today.length){
    h+='<h2>看診時請先談</h2><ul>'+
      fl.today.map(function(f){return '<li>'+esc(f.text)+'</li>'}).join('')+'</ul>';
  }else{
    h+='<div class="none">沒有需要先談的項目</div>';
  }

  if(cc.trim()) h+='<h2 class="q">病人自己說的</h2><div class="said">'+esc(cc)+'</div>';

  /* 沒有紅旗也沒有原話時,版面空著反而讓人以為壞掉 —— 補上有回報的症狀 */
  if(!fl.today.length&&!cc.trim()){
    var rep=[];
    PANEL.items.forEach(function(it){
      if(!(it['class']==='both'||it['class']===LOGIN.drug_class||LOGIN.drug_class==='both'))return;
      var s=A[it.id]||{};
      var any=Object.keys(s).some(function(k){var v=s[k];return typeof v==='number'&&v>0});
      if(any) rep.push(it.icon+' '+it.label);
    });
    h+='<div class="sym">'+(rep.length
      ? '<b>有回報的：</b><br>'+esc(rep.join('、'))
      : '<b>所有題目都回答沒有。</b>')+'</div>';
  }

  var un=0;
  PANEL.items.forEach(function(it){
    if(!(it['class']==='both'||it['class']===LOGIN.drug_class||LOGIN.drug_class==='both'))return;
    var s=A[it.id]||{};
    if(!it.q.some(function(q){var v=s[q.id];return v!==undefined&&v!==null&&v!==''})) un++;
  });
  if(un) h+='<div class="un">另有 '+un+' 題沒填（未填 ≠ 沒症狀）</div>';

  h+='</div><button id="docback">回到完整摘要</button>';
  var w=document.createElement('div'); w.innerHTML=h;
  document.body.appendChild(w);
  document.querySelector('#docback').onclick=function(){ w.remove() };
}

/* ===== 看診用摘要 =====
   靜態版沒有後端,所以「送出」的終點是產生一份給醫師看的摘要。
   內容與醫師端第一眼的四個框對齊:優先處理 / 病人原話 / 有回報的 / 未填。 */
function buildSummary(){
  var ev={}; PANEL.items.forEach(function(it){ ev[it.id]=A[it.id]||{} });
  ev.adl_i=A.adl_i; ev.adl_s=A.adl_s; ev.cc={text:(A.cc||{}).text||''};
  var fl=F.fire(PANEL,ev);
  var h='<div class="card">'+
    '<button id="docbtn">👨‍⚕️ 給醫師看（放大）</button>'+
    '<h1>看診用摘要</h1>'+
    '<p class="sub">把這個畫面拿給醫師看就可以了。<br>'+
    '（病歷號 '+esc(SESS.mrn)+'　'+esc(SESS.name)+'　'+
    (LOGIN.filled_by==='family'?'家屬代填':'本人填')+'）</p>';

  if(fl.today.length)
    h+='<div class="warnbox"><b style="font-size:20px">看診時請先談這幾項</b><ul style="margin:8px 0 0;padding-left:20px">'+
      fl.today.map(function(f){return '<li>'+esc(f.text)+'</li>'}).join('')+'</ul></div>';

  var cc=(A.cc||{}).text||'';
  if(cc.trim())
    h+='<div class="q"><div class="qt" style="font-size:20px">我自己想說的</div>'+
       '<div style="font-size:20px;line-height:1.75;padding:12px 14px;background:#efecf7;'+
       'border:1px dashed #544681;border-radius:8px">'+esc(cc)+'</div></div>';

  var rep=[],un=[];
  PANEL.items.forEach(function(it){
    if(!(it['class']==='both'||it['class']===LOGIN.drug_class||LOGIN.drug_class==='both')) return;
    var s=A[it.id]||{}, parts=[], any=false;
    /* 摘要是給醫師快速掃的,不是把問卷原句複述一遍。
       問句的框架字("最近有沒有…？"、"會不會…？")要拿掉,只留內容。 */
    function stem(t){
      return t.replace(/[？?].*$/,'')
              .replace(/^(最近|這次|您)?(有沒有|會不會|是不是)/,'')
              .replace(/^(最近|這次|您)/,'')
              .replace(/[，,].*$/,'').trim();
    }
    it.q.forEach(function(q){
      var v=s[q.id]; if(v===undefined||v===null||v==='') return;
      any=true;
      if(q.type==='yesno'){ if(v) parts.push(stem(q.text)); }
      else if(q.type==='choice'){ if(v>0) parts.push(q.opts[v]); }
      else if(q.type==='number'){ if(v>0) parts.push(stem(q.text)+' '+v+(q.unit||'')); }
    });
    if(s.bsa) parts.push('範圍約 '+s.bsa+'%');
    if(!any) un.push(it.label);
    else if(parts.length) rep.push({icon:it.icon,label:it.label,txt:parts.join('、')});
  });

  if(rep.length){
    h+='<div class="q"><div class="qt" style="font-size:20px">我有的症狀</div>';
    rep.forEach(function(r){
      h+='<div class="rvrow"><span class="rvq">'+r.icon+' '+esc(r.label)+
         '</span><span class="rva">'+esc(r.txt)+'</span></div>';
    });
    h+='</div>';
  }
  if(A.adl_i!=null||A.adl_s!=null)
    h+='<div class="rvrow"><span class="rvq">🏠 日常活動</span><span class="rva">'+
      (A.adl_i===1?'家事買菜有做不來的':'家事買菜都還行')+'<br>'+
      (A.adl_s===1?'洗澡穿衣有做不來的':'洗澡穿衣都還行')+'</span></div>';
  if(un.length)
    h+='<div class="note" style="margin-top:16px">沒填的：'+esc(un.join('、'))+
       '<br>沒填不等於沒症狀。</div>';

  h+='<div class="note" style="margin-top:18px;font-size:17px">'+esc(SAFETY.text)+
     '<div style="font-size:21px;font-weight:700;margin-top:8px">'+esc(SAFETY.phone)+'</div></div>';
  h+='<div style="margin-top:18px"><button class="btn" id="again" style="width:100%">回去修改</button></div>';
  h+='</div>';
  $('#done').innerHTML=h;
  var db=document.querySelector('#docbtn');
  if(db) db.onclick=function(){ doctorView(fl) };
  var ag=document.querySelector('#again');
  if(ag) ag.onclick=function(){
    $('#done').classList.add('hid');$('#review').classList.remove('hid');
    $('#nav').classList.remove('hid');$('#top').classList.remove('hid');
  };
}

/* ---------- 導覽 ---------- */
$('#next').onclick=function(){
  if($('#login').classList.contains('hid')===false) return startForm();
  if(!$('#review').classList.contains('hid')) return doSubmit();
  if(I<STEPS.length-1){I++;save();render();}
  else{$('#form').classList.add('hid');$('#review').classList.remove('hid');
       $('#next').textContent='產生看診用摘要';renderReview();window.scrollTo(0,0);}
};
$('#back').onclick=function(){
  if(!$('#review').classList.contains('hid')){
    $('#review').classList.add('hid');$('#form').classList.remove('hid');render();return}
  if(I>0){I--;save();render()}
};

function startForm(){
  var mrn=($('#mrn').value||'').replace(/\D/g,''), nm=($('#pname').value||'').trim();
  if(mrn.length<5||mrn.length>10){toast('病歷號看起來不太對，請再確認');return}
  if(!nm){toast('請填姓名');return}
  SESS={mrn:mrn,name:nm};
  /* 一次就診一個 token。續填靠它比對,而不是靠時間窗 —— 時間窗會把
     同一天的第二次填寫當成續填而覆蓋掉前一筆,跨次變化量就沒了。 */
  if(!VISIT) VISIT='v'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  buildSteps();
  $('#login').classList.add('hid');$('#form').classList.remove('hid');
  $('#back').classList.remove('hid');$('#top').classList.remove('hid');
  render();
}

/* ---------- 啟動 ---------- */
/* 連結帶權杖時直接換回身分,病人一個字都不用打。
   打錯一碼就掛到別人身上,而醫師端看到的是一位「沒症狀」的病人 —— 
   那是最危險的一種失敗,因為它不會報錯。 */
var TOKEN=(location.search.match(/[?&]t=([A-Za-z0-9]+)/)||[])[1]||null;
post({action:'spec'}).then(function(j){
  PANEL=j.panel;
  WATCH=j.watch_mode||'visit_only'; SAFETY=j.escalation||SAFETY;
  var pr=$('#promise');
  if(pr) pr.innerHTML=(WATCH==='monitored'
    ? '這份紀錄會在您進診間前先送到醫療團隊。<br>'
    : '這是<b>給醫師看診時參考用</b>的紀錄，幫您把想講的先整理好。<br>')
    + '慢慢填，填到一半被叫號也沒關係，會自動存起來。';
  if(TOKEN){
    post({action:'resolve',t:TOKEN}).then(function(k){
      if(k.status!=='ok'){
        $('#login').insertAdjacentHTML('afterbegin',
          '<div class="card"><div class="warnbox">這個連結'+
          ({used:'已經填過了',expired:'已經過期'}[k.message]||'無法使用')+
          '。請改用下面的欄位填寫，或向櫃台領取新的連結。</div></div>');
        return;
      }
      $('#mrn').value=k.mrn; $('#pname').value=k.name;
      LOGIN.drug_class=k.drug_class;
      $('#login').insertAdjacentHTML('afterbegin',
        '<div class="card"><div class="note" style="font-size:21px">'+
        esc(k.name)+' 您好，資料已經幫您帶好了。<br>按下面的「開始填寫」就可以開始。'+
        (k.kind==='standing'
          ? '<br><span style="font-size:17px">這個連結每次回診前都可以再打開，'+
            '建議把它加到手機主畫面。</span>' : '')+
        '</div></div>');
      radios($('#dclass'),[{v:'io',t:'免疫治療（IO）'},{v:'adc',t:'抗體藥物複合體（ADC）'},
        {v:'both',t:'兩種都有'}],function(v){LOGIN.drug_class=v},k.drug_class);
    });
  }
  var d=LS.get('epro2.draft',null);
  if(d&&d.mrn){
    $('#mrn').value=d.mrn;
    A=d.A||{};LOGIN=d.login||LOGIN;VISIT=d.visit||null;
    toast('找到上次填到一半的紀錄');
  }
  flush();
}).catch(function(){toast('連不上伺服器')});
window.addEventListener('online',flush);
</script></body></html>
